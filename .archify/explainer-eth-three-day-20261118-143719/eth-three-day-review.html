  <style>

    button { font:inherit; cursor:pointer; color:inherit; }

    .review-shell-header { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:16px 24px; padding:30px 0 20px; }

    .review-shell-period { margin:0; color:var(--shell-muted); font-size:13px; }
    .review-shell-theme { flex-shrink:0; border:1px solid var(--shell-rule); border-radius:8px; background:var(--shell-panel); padding:6px 12px; font-size:13px; }
    .review-shell-nav { display:flex; flex-wrap:wrap; gap:8px 22px; align-items:flex-end; border-bottom:1px solid var(--shell-rule); }
    .review-shell-tabs { display:flex; align-items:stretch; gap:22px; }
    .review-shell-tab { border:0; border-bottom:2px solid transparent; background:transparent; padding:10px 0 12px; white-space:nowrap; color:var(--shell-muted); font-size:14px; font-weight:500; }
    .review-shell-tab[aria-selected="true"] { color:var(--shell-ink); border-bottom-color:var(--shell-accent); }
    .review-shell-help { margin:0 0 13px auto; font-size:12px; color:var(--shell-muted); }
    .review-shell-panel { min-width:0; padding-top:18px; }
    .review-shell-panel iframe { display:block; width:100%; height:1400px; border:0; background:var(--shell-bg); }
    .review-shell-footer { padding:20px 0 28px; color:var(--shell-muted); font-size:12px; border-top:1px solid var(--shell-rule); margin-top:20px; }
    .review-shell-nojs { border:1px solid var(--shell-rule); padding:12px; border-radius:8px; }
    @media (max-width:600px) {
      .review-shell { width:calc(100% - 24px); }
      .review-shell-header { padding-top:20px; gap:12px; }
      .review-shell-header h1 { font-size:22px; }
      .review-shell-tabs { gap:20px; }
      .review-shell-help { width:100%; margin:0 0 10px; }
      .review-shell-nav { gap:0; }
      .review-shell-panel { padding-top:12px; }

bottom:3px;width:1.5px;background:var(--rule)}\n.steps b{display:block;font-size:14.5px;line-height:1.6;color:var(--ink)}\n.steps p{font-size:13.5px;line-height:1.65;color:var(--muted);margin-top:1px}\n/* Text linked to a diagram node, and the step-through controls */\n.term{text-decoration:underline dotted color-mix(in srgb,var(--accent) 55%,transparent);text-underline-offset:3px;text-decoration-thickness:1.5px;border-radius:3px;transition:background .15s}\n.term:hover,.term.term-lit{background:var(--accent-soft);color:var(--accent-ink);text-decoration-color:var(--accent)}\n.walk-start{margin-bottom:10px;font-size:12px;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--rule))}\n.walk-start[aria-pressed=true]{background:var(--accent-soft)}\n.js .walk-start[hidden]{display:none!important}\n.walk-bar{position:sticky;top:8px;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;padding:6px 8px;border:1px solid var(--rule);border-radius:10px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(6px);box-shadow:var(--shadow);font-size:12px}\n.walk-text{flex:1 1 220px;min-width:0;color:var(--ink);font-size:13px}\n.walk-text:empty{display:none}\n.walk-bar button{font-size:12px;padding:2px 10px}\n.walk-count{min-width:44px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}\n.steps li.walk-current::before{background:var(--accent);color:#fff;border-color:var(--accent)}\n.steps li.walk-current b,.steps li.walk-current .diagram-link{color:var(--accent-ink)}\n.steps li:not(.walk-current):has(~ .walk-current) b,.steps:has(.walk-current) li:not(.walk-current) p{opacity:.55}\n.diagram-link{color:var(--ink)}\n.diagram-link\u003espan{color:var(--faint);font-weight:400;transition:color .15s}\n.diagram-link:hover{color:var(--accent);text-decoration:none}\n.diagram-link:hover\u003espan{color:var(--accent)}\n.steps li:has(.diagram-link):hover::before,.steps li:has(.diagram-link:focus-visible)::before{background:var(--accent);color:#fff;border-color:var(--accent)}\n.steps li:hover .diagram-link,.steps li:hover .diagram-link\u003espan{color:var(--accent)}\n.steps li:has(.diagram-link):hover p{color:var(--secondary)}\n\n/* Diagram preview: native SVG re-tinted and re-typeset to the page */\n.diagram-panel .panel-body{display:flex;flex-direction:column;padding:14px 16px 16px}\n.block-diagram{flex:1;display:flex;flex-direction:column}\n.diagram{flex:1;display:flex;flex-direction:column}\n.diagram-preview{flex:1;min-width:0;max-width:100%;overflow:auto;display:flex;align-items:flex-start;padding:0}\n.diagram-preview\u003esvg{display:block;width:min(100%,calc(var(--native-width,100vw) * 1.25))!important;margin-inline:auto;height:auto!important;min-height:0!important;max-height:none!important;max-width:none!important}\n.diagram-preview\u003esvg\u003erect[fill^=\"url(\"],.diagram-preview [data-legend]{display:none}\n/* A single lane is the whole diagram, and lanes the shorthand adds only to stack branches carry no\n   meaning: the caption names the diagram, so their frames and numbered labels are noise. */\n.bare-lanes rect[data-composition-frame-kind=lane],.bare-lanes rect[data-composition-frame-kind=lane]+text{display:none}\n/* Phase labels then sit just above the nodes instead of above the hidden lane header. */\n.single-lane .phase-rule,.single-lane .phase-chip,.single-lane .phase-chip+text{transform:translateY(30px)}\n.diagram-preview text{font-family:var(--sans)!important}\n.board .diagram-preview.diagram-preview[class]{--bg:transparent;--lane-fill:color-mix(in srgb,var(--sunk) 55%,transparent);--lane-stroke:var(--control-border,var(--rule-strong));--grid:transparent;--canvas-dot:transparent;--mask:var(--surface);--panel:var(--surface);--text:var(--ink);--text-muted:var(--muted);--text-dim:var(--muted);--text-faint:var(--faint);--arrow:var(--faint);--arrow-emphasis:var(--accent);--frontend-fill:var(--surface);--frontend-stroke:var(--rule-strong);--backend-fill:var(--accent-soft);--backend-stroke:color-mix(in srgb,var(--accent) 50%,var(--rule));--database-fill:var(--sunk);--database-stroke:var(--rule-strong);--cloud-fill:var(--surface);--cloud-stroke:var(--rule-strong);--external-fill:var(--surface);--external-stroke:var(--rule-strong);--messagebus-fill:var(--surface);--messagebus-stroke:var(--rule-strong);--security-fill:var(--surface);--security-stroke:var(--rule-strong)}\n.diagram-preview .semantic-sigil{color:var(--muted);stroke:var(--muted)}\n.diagram-preview text.t-edge-default{fill:var(--accent-ink)}\n.diagram-preview [data-node-id],.diagram-preview [data-edge-id]{transition:opacity .18s}\n.diagram-preview.focusing [data-node-id]:not(.reader-highlight),.diagram-preview.focusing [data-edge-id]:not(.reader-highlight){opacity:.22}\n.diagram-preview [data-node-id].reader-highlight rect:not(.c-mask){stroke:var(--accent);stroke-width:2}\n.diagram-preview [data-edge-id].reader-highlight path{stroke:var(--accent)}\n.diagram-preview [data-edge-id].reader-highlight text{fill:var(--accent)}\n/* Steps beside the diagram they walk through, text on the left. The reader sets the diagram column\n   to the width its text needs; with less than 320px left for the steps, the diagram wraps above\n   them. The diagram stays in view while long steps scroll. */\n.diagram-panel .guided{flex-flow:row-reverse wrap;justify-content:center;align-items:flex-start;gap:16px 36px}\n.guided\u003e.guide-figure{flex:1 0 var(--guide-figure,100%);max-width:min(100%,var(--guide-figure-max,100%));min-width:0;display:flex;flex-direction:column}\n.guided.beside\u003e.guide-figure{position:sticky;top:12px}\n.guided\u003e.guide-text{flex:1 1 320px;min-width:0}\n/* The diagram's header: its title, and the way into the interactive view. */\n.diagram\u003efigcaption{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-height:28px;margin:0 0 10px;padding:0 2px;font-size:12px;color:var(--muted)}\n.diagram-title{font-size:12.5px;font-weight:500;color:var(--secondary)}\n.js .diagram-actions{display:flex!important;align-items:center;gap:10px;margin-left:auto}\n.explore-button{height:28px;padding:0 10px;font-size:12.5px;line-height:1;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 32%,var(--rule))}\n.explore-button .tool-icon{width:14px;height:14px;color:var(--accent)}\n.explore-button:hover{background:var(--accent-soft);color:var(--accent-ink)}\n.diagram\u003efigcaption .walk-start{margin:0}\n.js .diagram-preview [data-node-id]{cursor:pointer}\n.image figcaption,.code figcaption,.diff figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:10px;padding:0 4px}\n.js .diagram-semantics{display:none}\n.diagram-semantics{margin-top:8px;font-size:11px;color:var(--muted)}\n.diagram-semantics ul{padding-left:18px}\n.diagram-semantics code,.changes code{font-size:10px}\n.diagram-fit-status:not([hidden]){margin-top:6px}\n.changes{font-size:11px;margin-top:8px}\n.changes dd{margin-top:3px}\n.added{color:var(--good)}.removed{color:var(--bad)}.modified{color:var(--caution)}\n\n/* Code and diff */\n.chart{margin:0;display:flex;flex-direction:column;--pele-bg:transparent;--pele-fg:var(--ink);--pele-muted:var(--muted);--pele-line:var(--rule-strong);--pele-surface:var(--sunk);--pele-surface-alt:var(--zebra);--pele-border:var(--rule-strong);--pele-accent:var(--accent);--pele-font:var(--sans);--pele-font-mono:var(--mono);--pele-series-1:var(--accent);--pele-series-2:var(--caution);--pele-series-3:var(--good);--pele-series-4:var(--violet);--pele-series-5:var(--bad);--pele-series-6:var(--accent-ink);--pele-series-7:var(--muted);--pele-series-8:var(--faint)}\n/* Charts never scale above their native size, so their text stays at the page's small-text size. */\n.chart\u003esvg{display:block;width:min(100%,var(--native-width,100vw));height:auto;margin-inline:auto}\n.chart figcaption{font-size:12px;color:var(--muted);margin-top:8px;padding:0 4px}\n.snippet{border:1px solid var(--rule);border-radius:8px;background:var(--code);overflow:hidden}\n.snippet figcaption{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 12px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--muted);background:var(--panel)}\n.snippet-label{display:flex;align-items:center;gap:8px;min-width:0;color:var(--secondary);font-weight:500}\n.snippet-language{font-size:11px;color:var(--faint);background:none;border:0;padding:0;font-weight:400}\n.snippet pre{margin:0;border:0;border-radius:0;background:none;padding:12px 14px;font-size:12.5px;line-height:1.7;color:var(--ink)}\npre{max-width:100%;overflow:auto;font-size:12px;line-height:1.7;background:var(--code);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin:8px 0 0}\npre code{background:none;border:0;padding:0;white-space:pre;font-size:inherit}\n.diff-scroll{overflow:auto;max-width:100%;margin-top:8px;background:var(--code);border:1px solid var(--rule);border-radius:8px}\n.diff-code{width:100%;border-collapse:collapse;font:12px/1.7 var(--mono)}\n.diff-code th{font:10px/1.6 var(--sans);color:var(--muted);text-align:left;background:var(--sunk)}\n.diff-code th,.diff-code td{padding:0 8px;border:0;vertical-align:top}\n.diff-code .diff-line{display:table-row}\n.diff-code code{font:inherit;background:none;border:0;padding:0;white-space:pre}\n.diff-code .diff-number{width:1%;min-width:36px;text-align:right;user-select:none;color:var(--faint);border-right:1px solid var(--rule)}\n.diff-code .added{background:color-mix(in srgb,var(--good) 9%,var(--code));color:var(--good)}\n.diff-code .removed{background:color-mix(in srgb,var(--bad) 9%,var(--code));color:var(--bad)}\n.diff-code .hunk{color:var(--accent);background:var(--sunk)}\n.diff-code .header,.diff-code .no-newline{color:var(--muted)}\n.diff-code tbody tr\u003e*,.diff-code tbody tr:hover\u003e*{background:inherit}\n.diff-summary{white-space:nowrap}\n.image img{display:block;max-width:100%;height:auto;border-radius:8px}\n\n/* Footer */\nfooter{padding:28px 0 32px}\n.typical-footnotes{padding:0 0 16px;font-size:12px;color:var(--muted)}\n.typical-footnotes h2,.sources h2{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px}\n.typical-footnotes ol{padding-left:20px}\n.sources{border-top:1px solid var(--rule);padding-top:16px}\n.sources:has(ol:empty){display:none}\n.sources ol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 32px;padding-left:20px;font-size:12.5px;color:var(--muted)}\n.sources li{padding-left:4px;overflow-wrap:anywhere}\n.sources li::marker{font-size:11px;font-weight:600;color:var(--faint)}\n.sources a{color:var(--secondary)}\n.sources a:hover{color:var(--accent)}\n.sources code{display:block;margin-top:2px;font-size:11px;background:none;border:0;padding:0;color:var(--muted)}\n/* Colophon: the maker's mark, then what the reader can check on this page. */\n.colophon{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:28px;padding-top:18px;border-top:1px solid var(--rule)}\n.sources:has(ol:empty)+.colophon,.typical-footnotes+.colophon{margin-top:8px}\n.colophon-brand{display:inline-flex;align-items:center;gap:10px;min-width:0;color:var(--ink);text-decoration:none}\n.colophon-brand:hover{text-decoration:none}\n.colophon-mark{display:grid;place-items:center;flex-shrink:0;width:32px;height:32px;border-radius:9px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule)}\n.colophon-mark svg{width:19px;height:auto}\n.colophon-words{display:grid;gap:4px;min-width:0}\n.colophon-name{font:650 13.5px/1 var(--sans);letter-spacing:-.01em;transition:color .15s}\n.colophon-brand:hover .colophon-name{color:var(--accent)}\n.colophon-tagline{font-size:11.5px;line-height:1.3;color:var(--muted)}\n.colophon-facts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}\n.colophon-facts span+span::before{content:\"·\";margin:0 8px;color:var(--faint)}\n@media(max-width:760px){.colophon-facts{margin-left:0}}\n\n/* Source cards */\n.diagram-preview .has-source{cursor:help}\n.diagram-preview .has-source:hover rect:not(.c-mask){stroke:var(--accent);stroke-width:2}\n/* Source card: what kind of source, where it is, the evidence itself, then how to open it. */\n.source-card{position:absolute;z-index:30;display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:var(--panel);border:1px solid var(--control-border,var(--rule-strong));border-radius:12px;box-shadow:0 16px 40px rgb(16 24 40/.16);font-size:12.5px;color:var(--secondary)}\n.source-card header{display:flex;align-items:flex-start;gap:10px}\n.source-icon{display:grid;place-items:center;flex-shrink:0;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink)}\n.source-icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}\n.source-head{display:grid;gap:2px;flex:1;min-width:0}\n.source-card b{color:var(--ink);font-size:13px;line-height:1.4}\n.source-where{font:11.5px/1.4 var(--mono);color:var(--muted);overflow-wrap:anywhere}\n.source-number{flex-shrink:0;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:var(--sunk);font-size:11px;font-weight:600;color:var(--muted)}\n.source-card pre{margin:0;max-height:280px;font-size:11.5px;line-height:1.6;padding:8px 0;border-radius:8px}\n.source-card .line{display:block;padding:0 12px 0 0;white-space:pre}\n.source-card .line i{display:inline-block;width:3.2em;padding-right:10px;text-align:right;color:var(--faint);font-style:normal;user-select:none}\n.source-note{margin:0;padding:8px 12px;border-radius:8px;background:var(--sunk);box-shadow:inset 3px 0 0 var(--rule-strong);line-height:1.6}\n.source-note span{display:block;margin-top:2px;font-size:11.5px;color:var(--muted)}\n.source-card footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 0;border-top:1px solid var(--rule);font-size:11.5px;color:var(--muted)}\n.source-pin code{font-size:11px}\n.source-card a{font-size:12px;font-weight:500}\n@media print{.source-card{display:none!important}}\n\n/* Follow-up questions */\n.ask-button{margin-left:auto;flex-shrink:0;font-size:12px;padding:1px 9px;color:var(--muted);border-color:transparent;background:none;opacity:.7;transition:opacity .15s,color .15s,border-color .15s}\n.panel:hover .ask-button,.ask-button:focus-visible{opacity:1;border-color:var(--rule-strong)}\n.ask-button:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--rule))}\n.ask-floating{position:absolute;z-index:20;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--ink);color:var(--paper);border:0;box-shadow:0 4px 14px rgb(0 0 0/.18)}\n.ask-floating:hover{background:var(--accent);color:#fff}\n/* Follow-up dialog: where the question points, suggested questions, the reader's words, then copy. */\n.ask-dialog{width:min(560px,calc(100vw - 32px));padding:0;border-radius:14px}\n.ask-dialog form{margin:0;display:flex;flex-direction:column;gap:14px;padding:20px 22px 18px}\n.ask-dialog header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}\n.ask-dialog h2{font:600 16px/1.35 var(--sans);color:var(--ink)}\n.ask-where{margin-top:3px;font-size:12.5px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}\n.ask-close{display:grid;place-items:center;flex-shrink:0;width:28px;height:28px;margin:-3px -5px 0 0;padding:0;border:0;border-radius:50%;background:none;color:var(--faint);transition:background .15s,color .15s}\n.ask-close:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}\n.ask-close:focus{outline:none}\n.ask-close:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\n.ask-close svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}\n.ask-dialog blockquote{margin:0;padding:9px 12px;border-radius:8px;background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent);font-size:13px;line-height:1.6;color:var(--secondary);max-height:120px;overflow:auto}\n.ask-chips{display:flex;flex-wrap:wrap;gap:6px}\n.ask-chips button{height:28px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:999px;background:var(--panel);font-size:12.5px;line-height:1;color:var(--secondary);transition:background .15s,color .15s,border-color .15s}\n.ask-chips button:hover{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 45%,var(--rule))}\n.ask-chips button[aria-pressed=true]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,var(--rule));color:var(--accent-ink)}\n.ask-dialog textarea{min-height:96px;font:inherit;font-size:14px;line-height:1.6;color:var(--ink);background:var(--paper);border:1px solid var(--rule-strong);border-radius:10px;padding:10px 12px;resize:vertical;transition:border-color .15s,box-shadow .15s}\n.ask-dialog textarea::placeholder{color:var(--faint)}\n.ask-dialog textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);background:var(--panel)}\n.ask-dialog footer{display:flex;align-items:center;gap:8px;padding:0}\n.ask-note{flex:1;min-width:0;margin-right:8px;font-size:11.5px;line-height:1.45;color:var(--muted)}\n.ask-dialog footer button{background:var(--panel);color:var(--secondary)}\n.ask-dialog footer button:hover{background:var(--sunk);color:var(--ink)}\n.ask-dialog .primary,.ask-dialog .primary:hover{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}\n.ask-dialog .primary:hover{filter:brightness(1.06)}\n.ask-dialog .primary kbd{margin-left:2px;font:500 10.5px/1 var(--sans);opacity:.75}\n:root[data-theme=dark] .ask-dialog .primary{color:#0c0d10}\n@media(max-width:560px){.ask-note{flex-basis:100%;margin:0 0 4px}.ask-dialog footer{flex-wrap:wrap;justify-content:flex-end}}\n@media print{.ask-button,.ask-floating{display:none!important}}\n\n/* Dialogs */\ndialog{color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:0 24px 80px rgb(0 0 0/.25)}\ndialog::backdrop{background:rgb(10 10 12/.55);backdrop-filter:blur(2px)}\n/* The interactive view fills the window: the Viewer brings its own title and tools, so the dialog\n   adds no bar of its own, only a close control on the backdrop above it. */\n.viewer-dialog{width:min(1440px,calc(100vw - 48px));height:calc(100dvh - 76px);max-height:none;margin:56px auto 20px;padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--paper);box-shadow:0 30px 90px rgb(0 0 0/.45),0 0 0 1px rgb(255 255 255/.06)}\n.viewer-dialog[open]{display:flex;flex-direction:column}\n.viewer-dialog::backdrop{background:rgb(8 10 15/.72);backdrop-filter:blur(8px) saturate(.85)}\n.viewer-dialog h2{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}\n.viewer-close{position:fixed;top:12px;right:max(24px,calc((100vw - 1440px) / 2));display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 8px 0 12px;border:1px solid rgb(255 255 255/.16);border-radius:999px;background:rgb(255 255 255/.1);color:#fff;font-size:13px;line-height:1;transition:background .15s}\n.viewer-close:hover{background:rgb(255 255 255/.18)}\n.viewer-close:focus-visible{outline:2px solid #fff;outline-offset:2px}\n.viewer-close .tool-icon{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}\n.viewer-close kbd{padding:3px 6px;border-radius:5px;background:rgb(255 255 255/.14);font:500 10.5px/1 var(--sans);color:rgb(255 255 255/.8)}\n.viewer-dialog iframe{width:100%;flex:1;border:0;min-height:0}\n.dialog-loading{margin:auto;font-size:13px;color:var(--muted)}\n.dialog-loading[hidden]{display:none}\n.dialog-open{overflow:hidden}\n#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 15px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;z-index:100}\n#toast.visible{opacity:1}\n\n/* Styles. Clean is the default; editorial, product and swiss restyle the same structure. Each has a\n   light palette and a screen-only dark palette, so print always uses the light one. */\n:root[data-style=editorial]{--paper:#f6f2ea;--panel:#fbf8f2;--surface:#fbf8f2;--sunk:#f1ece2;--zebra:#f3eee5;--code:#f1ece2;--ink:#1d1a16;--secondary:#3a352e;--muted:#7a7166;--faint:#a39a8e;--rule:#e4dccf;--rule-strong:#d4c9b8;--accent:#9c2f1f;--accent-soft:#f4e6df;--accent-ink:#86261a;--marker:#f0d9cf;--badge:#1d1a16;--badge-ink:#fbf8f2;--shadow:none;--serif:\"Songti SC\",\"Noto Serif SC\",\"Source Han Serif SC\",Georgia,\"Times New Roman\",serif}\n:root[data-style=product]{--paper:#f3f4f8;--panel:#fff;--surface:#fff;--sunk:#f5f6fb;--zebra:#f7f8fc;--code:#f5f6fb;--ink:#0b0d12;--secondary:#272b35;--muted:#626a7b;--faint:#99a0ae;--rule:#e7e9f0;--rule-strong:#d7dbe6;--accent:#5b4bf5;--accent-soft:#f1efff;--accent-ink:#4a3be0;--marker:#e4e0ff;--badge:#5b4bf5;--badge-ink:#fff;--shadow:0 1px 2px rgb(16 24 40/.04),0 8px 24px rgb(16 24 40/.06)}\n:root[data-style=swiss]{--control-border:#d4d4d4;--paper:#fff;--panel:#fff;--surface:#fff;--sunk:#f4f4f4;--zebra:#f7f7f7;--code:#f4f4f4;--ink:#000;--secondary:#1f1f1f;--muted:#6b6b6b;--faint:#a0a0a0;--rule:#e6e6e6;--rule-strong:#000;--accent:#ff4f00;--accent-soft:#fff0e8;--accent-ink:#d94300;--marker:#ffe0cf;--badge:#000;--badge-ink:#fff;--shadow:none}\n@media screen{\n:root[data-style=editorial][data-theme=dark]{--paper:#171512;--panel:#1d1a16;--surface:#1d1a16;--sunk:#24211c;--zebra:#211e19;--code:#24211c;--ink:#f2ece2;--secondary:#d8d0c4;--muted:#a1978a;--faint:#6f675d;--rule:#2e2a24;--rule-strong:#3d372f;--accent:#e0806b;--accent-soft:#2e1d18;--accent-ink:#f0a08c;--marker:#4a2a20;--badge:#f2ece2;--badge-ink:#171512}\n:root[data-style=product][data-theme=dark]{--paper:#0d0e14;- t,[data-style=editorial] .callout h3{font-family:var(--serif)}\n[data-style=editorial] h1{font-size:30px;letter-spacing:0}\n[data-style=editorial] .masthead{border-bottom:2px solid var(--ink);margin-bottom:22px;padding-bottom:16px}\n[data-style=editorial] .panel{border:0;border-top:1px solid var(--rule-strong);border-radius:0;background:transparent;box-shadow:none}\n[data-style=editorial] .panel-head{border-bottom:0;padding:14px 4px 4px}\n[data-style=editorial] .panel-head h2{font-size:18px;font-weight:700}\n[data-style=editorial] .panel-id,[data-style=editorial] .answer-id{background:none;color:var(--accent);font:700 15px/1 Georgia,serif;min-width:0;padding:0}\n[data-style=editorial] .panel-body{padding:10px 4px 18px}\n[data-style=editorial] .verdict{background:none;box-shadow:inset 3px 0 0 var(--accent);border-radius:0;font-size:20px;line-height:1.7;padding:0 0 0 16px}\n[data-style=editorial] .answer-scope{border-top:1px dotted var(--rule-strong);padding:10px 4px}\n[data-style=editorial] tbody tr:nth-child(even)\u003e*{background:none;border-radius:0}\n[data-style=editorial] tbody td,[data-style=editorial] tbody th{border-bottom:1px solid var(--rule)}\n/* Product: soft cards, strong weights, one confident accent. */\n[data-style=product] h1{font-size:30px;font-weight:800;letter-spacing:-.025em}\n[data-style=product] .panel{border-radius:18px;border-color:transparent}\n[data-style=product] .panel-head{border-bottom:0;padding:18px 22px 6px}\n[data-style=product] .panel-head h2{font-size:17px;font-weight:700;letter-spacing:-.01em}\n[data-style=product] .panel-id{border-radius:8px;min-width:26px;height:26px;background:var(--accent-soft);color:var(--accent-ink);font-size:13px}\n[data-style=product] .answer-id{background:var(--accent);color:var(--badge-ink)}\n[data-style=product] .panel-body{padding:10px 22px 22px}\n[data-style=product] .answer-panel{background:linear-gradient(180deg,var(--accent-soft),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--accent) 2 tCount\":9},\"issues\":[]}}}}},\"sources\":{\"archive\":{\"id\":\"archive\",\"title\":\"币安官方历史数据归档\",\"url\":\"https://data.binance.vision/\"},\"klines\":{\"id\":\"klines\",\"title\":\"币安 USD-M K 线接口\",\"url\":\"https://developers.binance.com/docs/derivatives/usds-margined-futures/market-data/rest-api/Kline-Candlestick-Data\"}},\"assets\":{},\"diagnostics\":[]}\u003c/script\u003e\u003cscript type=\"application/json\" id=\"explainer-reader-words\"\u003e{\"answer\":\"结论\",\"answerMark\":\"答\",\"scope\":\"适用于\",\"sources\":\"来源\",\"print\":\"打印 / PDF\",\"image\":\"长图\",\"imageHints\":[\"最清晰\",\"体积最小\",\"兼容最好\"],\"export\":\"导出\",\"style\":\"样式\",\"styles\":{\"clean\":\"简洁\",\"editorial\":\"杂志\",\"product\":\"产品\",\"swiss\":\"网格\"},\"auto\":\"系统\",\"light\":\"浅色\",\"dark\":\"深色\",\"typical\":\"典型值\",\"explore\":\"打开交互图\",\"exploreTitle\":\"缩放、搜索节点、追踪路径和上下游，导出图片或动画\",\"close\":\"关闭\",\"loading\":\"正在打开交互图…\",\"graph\":\"图的结构\",\"changes\":\"结构改动\",\"added\":\"新增\",\"removed\":\"删除\",\"modified\":\"修改\",\"copy\":\"复制\",\"copied\":\"已复制\",\"walk\":\"逐步看\",\"walkMessages\":\"逐条看消息\",\"walkFlow\":\"沿流程看\",\"prev\":\"上一步\",\"next\":\"下一步\",\"end\":\"结束\",\"ask\":\"追问\",\"askQuote\":\"追问这段\",\"askPlaceholder\":\"哪里没看懂，或者希望这块补充什么？\",\"askCopy\":\"复制追问\",\"askCopied\":\"已复制，粘贴给 agent 即可\",\"askCancel\":\"取消\",\"askChips\":[\"没看懂这块\",\"展开讲讲\",\"举个例子\",\"依据是什么？\"],\"askPage\":\"页面\",\"askFile\":\"文件\",\"askWhere\":\"位置\",\"askQuoteLabel\":\"引用\",\"askQuestion\":\"问题\",\"askNote\":\"会一并复制页面、面板位置和 ID，agent 可以只改这一块。\",\"askPatch\":\"请用 Archify 的面板替换（patch explainer）只更新这个面板，保留它的 ID。\",\"tagline\":\"把你想理解、规划或分享的事，变成可以互动的可视化作品。\",\"facts\":{}}\u003c/script\u003e\u003cscript\u003e(() =\u003e {\n  'use strict';\n  const root = document.documentElement;\n  const read = id =\u003e JSON.parse(document.getElementById(id).textContent);\n  const prepared = read('archify-explainer-prepared');\n  const diagrams = prepared.preparedDiagrams.diagrams || prepared.preparedDiagrams;\n  const words = read('explainer-reader-words');\n  const english = !root.lang.startsWith('zh');\n  const say = (en,zh) =\u003e english ? en : zh;\n  const byId = id =\u003e document.getElementById(id);\n  const all = (selector, within = document) =\u003e [...within.querySelectorAll(selector)];\n  let toastTimer;\n  function notify(text) { const toast=byId('toast');toast.textContent=text;toast.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=\u003etoast.classList.remove('visible'),3000); }\n  // Measured board layout. Each panel is measured at every column width, then each column template is\n  // simulated and the one with the least page height and blank area wins. Panels keep source order on\n  // a 1px row grid, so the DOM and reading order never change.\n  // Without JavaScript, or on narrow windows, the static spans from the renderer stay in force.\n  const board = document.querySelector('.board');\n  function layoutBoard() {\n    const panels = all(':scope\u003e.panel',board);\n    const floor = textFloor();\n    // A diagram needs enough width for its smallest label to reach the reading floor.\n    const readableWidth = svg =\u003e {\n      const viewWidth = svg.viewBox.baseVal?.width || svg.getBoundingClientRect().width;\n      const smallest = Math.min(...all('text',svg).filter(text=\u003etext.textContent.trim() \u0026\u0026 !text.closest('[data-legend]')).map(text=\u003e(parseFloat(text.getAttribute('font-size')) || parseFloat(getComputedStyle(text).fontSize)) / secondary(text)));\n      return Number.isFinite(smallest) \u0026\u0026 smallest \u003e 0 ? viewWidth * floor / smallest : 0;\n    };\n    // Beside its steps, the diagram column is exactly that wide; without room for both, it wraps above them.\n    // It grows no wider than the preview draws the diagram, so spare width goes to the steps.\n    all('.guided').forEach(guide=\u003e{\n      const preview = guide.querySelector('.diagram-preview'), need = Math.ceil(readableWidth(preview.querySelector('svg')) + 2);\n      guide.style.setProperty('--guide-figure',need + 'px');\n      guide.style.setProperty('--guide-figure-max',Math.max(need,Math.ceil(parseFloat(getComputedStyle(preview).getPropertyValue('--native-width')) * 1.25 || 0)) + 'px');\n    });\n    const reset = () =\u003e { board.classList.remove('measured'); panels.forEach(panel=\u003e{panel.style.gridColumn = '';panel.style.gridRow = '';}); };\n    if (window.innerWidth \u003c= 760 || panels.length \u003c 2) { reset(); return; }\n    const gap = parseFloat(getComputedStyle(board).columnGap) || 0;\n    const column = (board.clientWidth - gap * 11) / 12;\n    const px = span =\u003e span * column + (span - 1) * gap;\n    const readableSpan = panel =\u003e {\n      const svgs = all('.diagram-preview\u003esvg',panel);\n      if (!svgs.length) return 0;\n      const body = panel.querySelector('.panel-body'), style = getComputedStyle(body);\n      const inset = panel.offsetWidth - body.clientWidth + parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);\n      const need = Math.max(...svgs.map(svg=\u003ereadableWidth(svg) + inset));\n      return [3,4,5,6,7,8,9,12].find(span=\u003epx(span) \u003e= need) || 12;\n    };\n    const SPANS = [4,5,6,7,8,12];\n    board.classList.add('measuring');\n    const items = panels.map(panel=\u003e{\n      const fixed = Number(panel.dataset.spanFixed) || 0;\n      const wide = fixed \u003e= 9 || Number((panel.className.match(/\\bspan(\\d+)\\b/) || [])[1]) \u003e= 9;\n      const min = Math.max(4,Number(panel.dataset.spanMin) || 4,fixed \u0026\u0026 fixed \u003c 9 ? fixed : 0,readableSpan(panel));\n      const height = {}, fits = {};\n      for (const span of SPANS) {\n        panel.style.width = px(span) + 'px';\n        height[span] = Math.ceil(panel.getBoundingClientRect().height);\n        fits[span] = span \u003e= min \u0026\u0026 !all('.table-scroll,.diff-scroll,pre',panel).some(element=\u003eelement.scrollWidth \u003e element.clientWidth + 1);\n      }\n      panel.style.width = '';\n      return {panel,wide,height,fits,text:panel.dataset.measure === 'text'};\n    });\n    board.classList.remove('measuring');\n    const width = board.clientWidth;\n    const excess = (item,span) =\u003e item.text ? Math.max(0,px(span) - 720) / 720 * px(span) * item.height[span] * .6 : 0;\n    // One set of column lines per section. Panels fill the shortest fitting column in source\n    // order; a panel that fits no column takes the full width and closes the section above it. The\n    // last panel of every column stretches to the section bottom, so column edges and bottoms align.\n    function simulate(template, section, forced = []) {\n      const lines = template.reduce((acc,span)=\u003e[...acc,acc[acc.length - 1] + span],[1]);\n      const placed = [], options = [], chosen = [];\n      let cursor = 0, waste = 0, wide = 0, heights, last, previous;\n      const open = () =\u003e { heights = template.map(()=\u003e0); last = template.map(()=\u003enull); previous = {top:0,c:-1,height:0}; };\n      // heights[c] is the offset of the next panel in column c, so it includes one trailing gap.\n      const close = () =\u003e {\n        // A conclusion alone in its section takes the full width rather than leaving blank columns beside it.\n        const alone = last.filter(Boolean);\n        if (alone.length === 1 \u0026\u0026 alone[0] === placed[0] \u0026\u0026 placed.length === 1 \u0026\u0026 template.length \u003e 1) {\n          Object.assign(alone[0],{line:1,span:12,height:alone[0].item.height[12]});\n          cursor += alone[0].height + gap;\n          open();\n          return;\n        }\n        const bottom = Math.max(...heights) - gap;\n        if (bottom \u003c= 0) return;\n        template.forEach((span,c)=\u003e{\n          waste += px(span) * (heights[c] ? bottom - (heights[c] - gap) : bottom * 1.6);\n          if (last[c]) last[c].height = cursor + bottom - last[c].top;\n        });\n        cursor += bottom + gap;\n box.bottom + 8 : box.top - 8 - card.offsetHeight) + scrollY}px`;\n    };\n    all('.cite a[href^=\"#source-\"]').forEach(link=\u003e{\n      link.addEventListener('mouseenter',()=\u003eshow(link)); link.addEventListener('focus',()=\u003eshow(link));\n      link.addEventListener('mouseleave',hide); link.addEventListener('blur',hide);\n    });\n    // A diagram node tied to a source opens the same card, so a code diagram doubles as a code tour.\n    all('.diagram-preview[data-node-sources]').forEach(preview=\u003e{\n      let map = {}; try { map = JSON.parse(preview.dataset.nodeSources); } catch {}\n      all('[data-node-id]',preview).forEach(node=\u003e{\n        const id = map[node.dataset.nodeId]; if (!id) return;\n        node.classList.add('has-source');\n        node.addEventListener('mouseenter',()=\u003eshow(node,id)); node.addEventListener('mouseleave',hide);\n      });\n    });\n    document.addEventListener('keydown',event=\u003e{ if (event.key === 'Escape') card.hidden = true; });\n  }\n  // Checklist ticks are the reader's own progress; keep them per page and block across reloads.\n  all('.checklist').forEach(list=\u003e{\n    const key = `archify-checklist:${root.dataset.artifact}:${list.closest('.block').id}`, boxes = all('input',list);\n    let saved = []; try { saved = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}\n    boxes.forEach((box,index)=\u003e{ box.checked = saved[index] === 1; box.addEventListener('change',()=\u003e{ try { localStorage.setItem(key,JSON.stringify(boxes.map(b=\u003eb.checked ? 1 : 0))); } catch {} }); });\n  });\n  // Native dialogs supply Escape, focus trapping and the accessible modal semantics.\n  const printDetails = new Map();\n  all('.diagram-semantics').forEach(details=\u003edetails.open = false);\n  window.addEventListener('beforeprint',()=\u003eall('.diagram-semantics').forEach(details=\u003e{printDetails.set(details,details.open);details.open = true;}));\n  window.addEventListener('afterprint',()=\u003e{printDetails.forEach((open,details)=\u003edetails.open = open);printDetails.clear();});\n  root.classList.add('js');\n  applyTheme();\n  cropDiagramPreviews();\n  linkTerms();\n  setupWalks();\n  setupAsk();\n  setupSourceCards();\n  layoutBoard();\n  const relayout = () =\u003e { layoutBoard(); ensureDiagramReadability(); };\n  Promise.resolve(document.fonts?.ready).then(()=\u003erequestAnimationFrame(()=\u003erequestAnimationFrame(relayout)));\n  let resizeFrame;\n  window.addEventListener('resize',()=\u003e{cancelAnimationFrame(resizeFrame);resizeFrame = requestAnimationFrame(relayout);});\n})();\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e";
    const themeButton = document.getElementById('review-theme');
    const tabNames = ['chart', 'report'];
    const views = Object.fromEntries(tabNames.map(name => [name, {
      name, tab:document.getElementById('tab-' + name),
      panel:document.getElementById('panel-' + name),
      frame:document.getElementById('frame-' + name),
      html:name === 'chart' ? chartDocument : explainerDocument,
      loaded:false, scheduled:false, cleanup:[], height:0
    }]));
    let selected = 'chart';
    let theme = 'dark';
    let syncingTheme = false;
    const palettes = {
      dark:{'--background':'#0c0d10','--foreground':'#f1f3f6','--muted-foreground':'#9ba3b1','--border':'#303640','--orange':'#f4a65d','--green':'#5cc98d','--red':'#f2806f','--purple':'#b7a5ff','--blue':'#91b7ff'},
      light:{'--background':'#f4f5f7','--foreground':'#161a22','--muted-foreground':'#5c6575','--border':'#d3d9e2','--orange':'#ad5700','--green':'#11824c','--red':'#c4321f','--purple':'#6a4fc8','--blue':'#2457d6'}
    };

    function prepareDocument(html) {
      const css = Object.entries(palettes[theme]).map(([key,value]) => key + ':' + value).join(';');
      const early = '<style id="review-host-theme">:root{' + css + ';color-scheme:' + theme + '}</style>';
      const starter = '<script>document.documentElement.dataset.theme=' + JSON.stringify(theme) + ';<\/script>';
      if (/<head(?:\s[^>]*)?>/i.test(html)) return html.replace(/<head(?:\s[^>]*)?>/i, match => match + early + starter);
      return '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' + early + starter + '</head><body>' + html + '</body></html>';
    }

    function applyDocumentTheme(doc) {
      if (!doc?.documentElement) return;
      const root = doc.documentElement;
      root.dataset.theme = theme;
      root.style.colorScheme = theme;
      Object.entries(palettes[theme]).forEach(([key,value]) => root.style.setProperty(key,value));
      // Use Archify's own button so its internal theme state and native viewers agree.
      const choice = doc.querySelector('[data-theme-choice="' + theme + '"]');
      if (choice && choice.getAttribute('aria-pressed') !== 'true') choice.click();
      doc.querySelectorAll('iframe').forEach(frame => {
        try { applyDocumentTheme(frame.contentDocument); } catch (_) { /* Sandboxed native viewers own their theme. */ }
      });
    }

    function setTheme(next) {
      if (next !== 'dark' && next !== 'light') return;
      theme = next;
      document.documentElement.dataset.theme = theme;
      const label = theme === 'dark' ? '浅色' : '深色';
      themeButton.textContent = label + '模式';
      themeButton.setAttribute('aria-label', '切换到' + label + '主题');
      syncingTheme = true;
      Object.values(views).forEach(view => {
        if (!view.loaded) return;
        try { applyDocumentTheme(view.frame.contentDocument); } catch (_) { /* Local srcdoc is normally same-origin. */ }
        queueMeasure(view);
      });
      syncingTheme = false;
    }

    function updateViewport(view) {
      const doc = view.frame.contentDocument;
      if (!doc?.documentElement) return;
      const top = Math.max(0, -view.frame.getBoundingClientRect().top);
      doc.documentElement.style.setProperty('--review-host-viewport', window.innerHeight + 'px');
      doc.documentElement.style.setProperty('--review-host-dialog-top', top + 'px');
    }

    function measure(view) {
      view.scheduled = false;
      if (view.name !== selected || view.panel.hidden) return;
      const doc = view.frame.contentDocument;
      const body = doc?.body;
      if (!body) return;
      const win = view.frame.contentWindow;
      const box = body.getBoundingClientRect();
      const bodyStyle = win.getComputedStyle(body);
      let bottom = box.bottom + win.scrollY + (parseFloat(bodyStyle.marginBottom) || 0);
      // Ignore viewport-sized document scrollHeight: it would prevent shrinking.
      for (const node of body.children) {
        if (['SCRIPT','STYLE','LINK'].includes(node.tagName)) continue;
        const style = win.getComputedStyle(node);
        if (style.display === 'none' || style.position === 'fixed' || style.position === 'absolute') continue;
        bottom = Math.max(bottom, node.getBoundingClientRect().bottom + win.scrollY + (parseFloat(style.marginBottom) || 0));
      }
      const height = Math.max(160, Math.ceil(bottom) + 2);
      if (Math.abs(height - view.height) > 1) {
        view.height = height;
        view.frame.style.height = height + 'px';
      }
      updateViewport(view);
    }

    function queueMeasure(view) {
      if (view.scheduled || view.name !== selected || view.panel.hidden) return;
      view.scheduled = true;
      requestAnimationFrame(() => measure(view));
    }

    function connectFrame(view) {
      view.cleanup.forEach(dispose => dispose());
      view.cleanup = [];
      const doc = view.frame.contentDocument;
      if (!doc?.body) return;
      view.loaded = true;
      const style = doc.createElement('style');
      style.textContent = 'html,body{min-height:0!important;height:auto!important}'+
        '.viewer-dialog{top:calc(var(--review-host-dialog-top,0px) + 56px)!important;bottom:auto!important;margin-top:0!important;height:calc(var(--review-host-viewport,100dvh) - 76px)!important}'+
        '.viewer-close{top:calc(var(--review-host-dialog-top,0px) + 12px)!important}';
      doc.head.appendChild(style);
      syncingTheme = true;
      applyDocumentTheme(doc);
      syncingTheme = false;
      const resize = new ResizeObserver(() => queueMeasure(view));
      resize.observe(doc.body);
      Array.from(doc.body.children).filter(node => !['SCRIPT','STYLE'].includes(node.tagName)).forEach(node => resize.observe(node));
      const mutation = new MutationObserver(() => queueMeasure(view));
      mutation.observe(doc.body, {subtree:true,childList:true,characterData:true});
      const onLoad = () => queueMeasure(view);
      const onThemeChoice = event => {
        if (syncingTheme || !event.target.closest?.('[data-theme-choice]')) return;
        queueMicrotask(() => {
          const next = doc.documentElement.dataset.theme;
          if (next !== theme) setTheme(next);
        });
      };
      doc.addEventListener('load', onLoad, true);
      doc.addEventListener('click', onThemeChoice);
      view.cleanup.push(() => resize.disconnect(), () => mutation.disconnect(), () => doc.removeEventListener('load',onLoad,true), () => doc.removeEventListener('click',onThemeChoice));
      if (doc.fonts?.ready) doc.fonts.ready.then(() => queueMeasure(view));
      queueMeasure(view);
    }

    function loadView(view) {
      if (view.frame.dataset.started) return;
      view.frame.dataset.started = 'true';
      view.frame.addEventListener('load', () => connectFrame(view));
      view.frame.srcdoc = prepareDocument(view.html);
    }

    function selectView(name, focusTab = false) {
      selected = name;
      tabNames.forEach(key => {
        const view = views[key];
        const active = key === name;
        view.tab.setAttribute('aria-selected',String(active));
        view.tab.tabIndex = active ? 0 : -1;
        view.panel.hidden = !active;
      });
      const view = views[name];
      loadView(view);
      if (focusTab) view.tab.focus();
      requestAnimationFrame(() => {
        // The chart keeps its selected trade; resizing redraws it at the visible width.
        view.frame.contentWindow?.dispatchEvent(new Event('resize'));
        queueMeasure(view);
      });
    }

    tabNames.forEach((name,index) => {
      views[name].tab.addEventListener('click', () => selectView(name));
      views[name].tab.addEventListener('keydown', event => {
        let target;
        if (event.key === 'ArrowRight') target = (index + 1) % tabNames.length;
        else if (event.key === 'ArrowLeft') target = (index + tabNames.length - 1) % tabNames.length;
        else if (event.key === 'Home') target = 0;
        else if (event.key === 'End') target = tabNames.length - 1;
        else return;
        event.preventDefault();
        selectView(tabNames[target], true);
      });
    });
    themeButton.addEventListener('click', () => setTheme(theme === 'dark' ? 'light' : 'dark'));
    window.addEventListener('resize', () => queueMeasure(views[selected]), {passive:true});
    window.addEventListener('scroll', () => updateViewport(views[selected]), {passive:true});
    selectView('chart');
  })();
  </script>
